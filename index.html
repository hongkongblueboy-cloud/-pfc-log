<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./icon.png?v=2">
<title>PFC Log</title>
<style>
  :root {
    --bg: #f5f4f0;
    --card: #ffffff;
    --row: #f0efe9;
    --text: #1a1a18;
    --text-2: #6b6a64;
    --text-3: #a09f97;
    --border: rgba(0,0,0,0.08);
    --track: #e8e7e0;
    --bar-k: #1a1a18;
    --bar-p: #378ADD;
    --bar-f: #EF9F27;
    --bar-c: #1D9E75;
    --over: #E24B4A;
    --ok: #1D9E75;
    --accent-text: #185FA5;
    --send: #1a1a18;
    --send-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171716;
      --card: #232322;
      --row: #2e2e2c;
      --text: #f0efe9;
      --text-2: #a3a29a;
      --text-3: #6f6e67;
      --border: rgba(255,255,255,0.09);
      --track: #3a3a37;
      --bar-k: #f0efe9;
      --over: #F09595;
      --ok: #5DCAA5;
      --accent-text: #85B7EB;
      --send: #f0efe9;
      --send-fg: #1a1a18;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card);
    border-bottom: 0.5px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 14px;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 2px;
    margin-bottom: 12px;
  }
  .kpi-btn { margin-left: auto; }
  .date-nav { display: flex; align-items: center; gap: 4px; }
  .date-nav button {
    background: none; border: none; color: var(--text-2);
    font-size: 18px; padding: 4px 8px; cursor: pointer; line-height: 1;
  }
  .date-label { font-size: 15px; font-weight: 600; min-width: 110px; text-align: center; white-space: nowrap; }
  .kpi-btn {
    background: none; border: none; color: var(--text-3);
    font-size: 12px; cursor: pointer; padding: 4px 0; white-space: pre;
  }
  .kcal-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
  .kcal-now { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
  .kcal-goal { font-size: 13px; color: var(--text-2); }
  .kcal-left { margin-left: auto; font-size: 13px; font-weight: 600; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .kcal-bar { margin-bottom: 14px; }
  .macros { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .criteria-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; letter-spacing: 0.1em; color: var(--text-3);
    margin-bottom: 7px;
  }
  .streak { font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--ok); }
  .criteria { display: flex; align-items: stretch; }
  .criterion {
    flex: 1 1 0; min-width: 0; text-align: center;
    font-size: 12px; font-weight: 600; color: var(--text);
    line-height: 1.45; padding: 0 4px; word-break: break-word;
    border-left: 0.5px solid var(--border);
  }
  .criterion:first-child { border-left: none; }

  .tl-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; letter-spacing: 0.1em; color: var(--text-3);
    margin: 14px 0 9px; padding-top: 13px; border-top: 0.5px solid var(--border);
  }
  .tl-countdown { font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--text-2); }
  .timeline { display: flex; }
  .tl-step { flex: 1 1 0; min-width: 0; text-align: center; position: relative; }
  .tl-step::before, .tl-step::after {
    content: ''; position: absolute; top: 4px; height: 1px; background: var(--border);
  }
  .tl-step::before { left: 0; right: 50%; }
  .tl-step::after { left: 50%; right: 0; }
  .tl-step:first-child::before, .tl-step:last-child::after { display: none; }
  .tl-dot {
    position: relative; z-index: 1; width: 9px; height: 9px; border-radius: 50%;
    margin: 0 auto 6px; background: var(--bg); border: 1px solid var(--border);
  }
  .tl-when { font-size: 12px; color: var(--text-3); line-height: 1.3; }
  .tl-what { font-size: 13px; color: var(--text-3); font-weight: 600; line-height: 1.35; }
  .tl-step.done .tl-dot { background: var(--text-3); border-color: var(--text-3); }
  .tl-step.next .tl-dot { background: var(--ok); border-color: var(--ok); }
  .tl-step.next .tl-when { color: var(--text-2); }
  .tl-step.next .tl-what { color: var(--text); }
  #g-week { font-size: 16px; font-weight: 600; letter-spacing: 0; }
  #view-gym .kcal-goal, #view-gym .kcal-left { font-size: 16px; }
  #g-sleep { color: var(--text-2); white-space: pre; min-width: 112px; text-align: right; font-size: 16px; font-weight: 400; }
  .gym-row2 { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
  .inline-gauge { flex: 1 1 auto; min-width: 32px; margin: 0 12px; align-self: center; }
  .gym-year { font-size: 16px; color: var(--text-2); }
  #g-volume, #g-distance { color: var(--text-2); white-space: pre; min-width: 112px; text-align: right; }
  .wk-card { background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .wk-title { font-size: 11px; letter-spacing: 0.08em; color: var(--text-3); margin-bottom: 10px; }
  .wk-row { display: flex; align-items: center; gap: 16px; }
  .wk-legend { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .wk-legend div { display: flex; align-items: center; gap: 8px; }
  .wk-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .wk-legend b { margin-left: auto; font-weight: 600; }
  #view-weekly .date-label { font-size: 16px; text-align: left; white-space: pre; }
  #view-weekly header { padding-bottom: 12px; }
  #view-weekly .header-top { margin-bottom: 0; }
  .w-monthly { margin-left: auto; font-size: 15px; color: var(--text-3); letter-spacing: 0; }
  .wk-split { display: grid; grid-template-columns: 1fr 104px; gap: 8px; }
  .wk-sleep { display: flex; flex-direction: column; justify-content: center; padding: 14px 12px; }
  .wk-sleep-t { font-size: 26px; font-weight: 400; letter-spacing: -0.5px; line-height: 1.1; color: var(--text-3); margin-bottom: 14px; }
  .wk-sleep-v { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .wk-score { display: flex; align-items: baseline; gap: 6px; margin-bottom: 12px; }
  .wk-score b { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
  .wk-score span { font-size: 13px; color: var(--text-2); }
  .wk-score-bd { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .wk-score-bd div { display: flex; align-items: center; gap: 8px; }
  .wk-score-bd b { margin-left: auto; font-weight: 600; }
  .wk-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .wk-stat { text-align: center; }
  .wk-stat span { display: block; font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
  .wk-stat b { font-size: 19px; font-weight: 700; }
  .wk-bars { display: flex; align-items: flex-end; gap: 6px; height: 110px; }
  .wk-bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 4px; }
  .wk-bar i { display: block; border-radius: 3px 3px 0 0; background: var(--text); }
  .wk-bar em { font-style: normal; font-size: 10px; color: var(--text-3); text-align: center; }
  .plan-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .plan-input { display: grid; grid-template-columns: 1fr auto 76px auto auto; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
  .plan-input input { width: 76px; border: 1px solid var(--text-3); background: var(--card); color: var(--text); font-size: 16px; padding: 7px 10px; border-radius: 8px; outline: none; }
  .plan-input button { border: none; border-radius: 8px; background: var(--send); color: var(--send-fg); font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; cursor: pointer; }
  .plan-tab {
    flex: 1; padding: 8px 0; border-radius: 8px; cursor: pointer;
    border: 0.5px solid var(--border); background: var(--card);
    color: var(--text-2); font-family: inherit; font-size: 13px; font-weight: 600;
  }
  .plan-tab.on { background: var(--text); color: var(--card); border-color: var(--text); }
  #view-body header { padding: calc(env(safe-area-inset-top) + 12px) 16px 0; }
  #view-body main { padding-top: 0; }
  .plan { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  .plan col-w1 { }
  .plan th, .plan td { padding: 7px 6px; text-align: right; white-space: nowrap; border-bottom: 0.5px solid var(--border); }
  .plan th:nth-child(1), .plan td:nth-child(1) { width: 15%; }
  .plan th:nth-child(2), .plan td:nth-child(2) { width: 13%; }
  .plan th:nth-child(3), .plan td:nth-child(3) { width: 15%; }
  .plan th:nth-child(4), .plan td:nth-child(4) { width: 14%; }
  .plan th:nth-child(5), .plan td:nth-child(5) { width: 16%; }
  .plan th:nth-child(6), .plan td:nth-child(6) { width: 14%; }
  .plan th:nth-child(7), .plan td:nth-child(7) { width: 13%; }
  .plan th {
    color: var(--text); font-weight: 600; font-size: 12px; text-align: right;
  }
  .plan td:first-child, .plan th:first-child { text-align: left; }
  .plan td:nth-child(4) { padding-left: 16px; }
  .plan td:nth-child(5) { padding-left: 0; padding-right: 2px; }
  .plan tr.now td { background: #fbe9d8; font-weight: 600; color: var(--text); }
  .plan tr.past td { color: var(--text-3); }
  .macro-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .macro-head .label { color: var(--text-2); font-weight: 600; }
  .macro-head .val { font-weight: 600; }
  .macro-head .goal { color: var(--text-3); font-weight: 400; }
  .macro .bar { height: 5px; }
  .macro-note { font-size: 11px; margin-top: 3px; color: var(--text-2); }
  .macro-note.over { color: var(--over); font-weight: 600; }
  .macro-note.ok { color: var(--accent-text); }

  main { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .empty {
    text-align: center; color: var(--text-3); font-size: 13px;
    padding: 48px 0; line-height: 1.8;
  }
  .empty b { display: block; font-size: 15px; color: var(--text-2); font-weight: 600; margin-bottom: 2px; }
  .empty-hint { display: block; margin-top: 10px; font-size: 11px; }
  .entry { display: flex; align-items: center; gap: 10px; }
  .entry .time { font-size: 11px; color: var(--text-3); min-width: 36px; text-align: right; }
  .entry .time.edit { cursor: pointer; text-decoration: underline; text-decoration-color: var(--border); }
  .entry .body {
    flex: 1; display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; row-gap: 2px;
    gap: 8px; padding: 9px 12px; background: var(--card); border-radius: 10px;
    border: 0.5px solid var(--border); min-width: 0;
  }
  .entry .name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .pfc { font-size: 12px; color: var(--text-2); white-space: pre; flex-shrink: 0; margin-left: auto; }
  .entry .sets {
    font-size: 12px; color: var(--text-2); margin-left: auto; min-width: 0;
    white-space: pre-wrap; word-break: break-word; text-align: right;
  }
  .entry .del {
    background: none; border: none; color: var(--text-3); font-size: 16px;
    padding: 4px 6px; cursor: pointer; line-height: 1; flex-shrink: 0;
  }

  .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .view.active { display: flex; }

  .bottom {
    position: sticky;
    bottom: 0;
    background: var(--bg);
  }
  footer {
    background: var(--bg);
    padding: 8px 16px 12px;
  }
  footer[hidden] { display: none; }
  .tabbar {
    display: flex;
    background: var(--card);
    border-top: 0.5px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--text-3); padding: 13px 0 12px;
    border-top: 2px solid transparent; margin-top: -1px;
  }
  .tab.active { color: var(--text); border-top-color: var(--text); }
  .tab[data-view="pfc"].active { border-top-color: #1E7FE8; }
  .tab[data-view="rocket"].active { border-top-color: #17B45E; }
  .tab[data-view="gym"].active { border-top-color: #6A1B9A; }
  .tab[data-view="body"].active { border-top-color: #E8710A; }
  .tab[data-view="weekly"].active { border-top-color: #0E9AA7; }
  .input-row { display: flex; align-items: flex-end; gap: 8px; }
  #mult-btn {
    height: 40px; min-width: 48px; padding: 0 10px; border-radius: 20px;
    border: 0.5px solid var(--border); background: var(--card); color: var(--text-2);
    font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    font-family: inherit;
  }
  #mult-btn.active { color: var(--accent-text); border-color: var(--accent-text); }
  .mult-panel {
    display: none; background: var(--card); border: 0.5px solid var(--border);
    border-radius: 14px; padding: 12px 16px 14px; margin-bottom: 8px;
  }
  .mult-panel.open { display: block; }
  .mult-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--text-2); margin-bottom: 8px; gap: 8px;
  }
  .mult-head b { font-size: 15px; color: var(--text); }
  .mult-preview { font-size: 11px; color: var(--text-3); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mult-range { width: 100%; accent-color: var(--send); margin: 2px 0 0; }
  .mult-ticks {
    display: flex; justify-content: space-between; font-size: 10px;
    color: var(--text-3); margin-top: 2px; padding: 0 8px;
  }
  .entry .mult-badge {
    font-size: 11px; font-weight: 600; color: var(--accent-text);
    background: none; margin-left: 4px;
  }
  .line-input {
    flex: 1; border: 0.5px solid var(--border); background: var(--card);
    color: var(--text); font-size: 16px; padding: 10px 16px;
    border-radius: 22px; outline: none; min-width: 0;
    font-family: inherit;
    height: 41px; line-height: 20px; resize: none; overflow-y: auto;
    transition: height 0.15s ease;
  }
  .line-input:focus { height: 61px; }
  .line-input::placeholder { color: var(--text-3); }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--send); color: var(--send-fg); font-size: 18px;
    cursor: pointer; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center;
  }
  .send-btn:active { transform: scale(0.94); }
  .recent-row {
    display: flex; gap: 6px; overflow-x: auto; margin-top: 8px;
    padding-bottom: 2px; scrollbar-width: none;
  }
  .recent-row::-webkit-scrollbar { display: none; }
  #gym-todo { flex-wrap: wrap; overflow-x: visible; row-gap: 6px; }
  #gym-todo .recent-chip { background: var(--text-2); color: #fff; border-color: var(--text-2); }
  #gym-todo .recent-chip.sleep { background: var(--text); border-color: var(--text); }
  .recent-chip.pinned { background: var(--text-2); color: #fff; border-color: var(--text-2); }
  .recent-chip {
    flex-shrink: 0; padding: 6px 12px; border-radius: 16px;
    background: var(--card); border: 0.5px solid var(--border);
    font-size: 13px; color: var(--text-2); cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .recent-chip:active { transform: scale(0.97); }
  .update-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--card); border: 0.5px solid var(--border); border-radius: 14px;
    padding: 8px 12px; margin: 0 16px 8px; font-size: 12px; color: var(--text-2);
  }
  .update-bar[hidden] { display: none; }
  #update-btn {
    border: 0.5px solid var(--border); background: var(--row); color: var(--text);
    border-radius: 14px; font-size: 12px; font-weight: 600; padding: 5px 12px;
    cursor: pointer; font-family: inherit;
  }
  .hint { font-size: 11px; color: var(--text-3); text-align: center; margin-top: 8px; }
  .hint.error { color: var(--over); font-weight: 600; }

  dialog {
    border: none; border-radius: 16px; background: var(--card); color: var(--text);
    padding: 20px; width: min(90vw, 320px);
    margin: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,0.4); }
  dialog h2 { font-size: 16px; margin-bottom: 4px; }
  dialog p { font-size: 12px; color: var(--text-2); margin-bottom: 14px; }
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .kpi-field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .kpi-field input {
    width: 100%; border: 0.5px solid var(--border); background: var(--row);
    color: var(--text); font-size: 16px; padding: 8px 10px; border-radius: 8px; outline: none;
  }
  .backup-sec { border-top: 0.5px solid var(--border); margin-top: 4px; padding-top: 12px; margin-bottom: 16px; }
  .backup-title { font-size: 12px; color: var(--text-2); font-weight: 600; margin-bottom: 8px; }
  .backup-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn-backup {
    flex: 1; border: 0.5px solid var(--border); background: var(--row); color: var(--text);
    border-radius: 8px; font-size: 13px; font-weight: 600; padding: 9px 0;
    cursor: pointer; font-family: inherit;
  }
  .backup-note { font-size: 11px; color: var(--text-3); line-height: 1.5; }
  .backup-note.error { color: var(--over); }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .dialog-actions button {
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
    padding: 9px 16px; cursor: pointer;
  }
  .btn-cancel { background: var(--row); color: var(--text-2); }
  .btn-save { background: var(--send); color: var(--send-fg); }
</style>
</head>
<body>

<div class="view" id="view-pfc">
<header>
  <div class="header-top">
    <div class="date-nav">
      <button id="prev-day" aria-label="前の日">‹</button>
      <div class="date-label" id="date-label"></div>
      <button id="next-day" aria-label="次の日">›</button>
    </div>
    <button class="kpi-btn" id="kpi-open"></button>
  </div>
  <div class="kcal-row">
    <span class="kcal-now" id="kcal-now">0</span>
    <span class="kcal-goal" id="kcal-goal">/ 2100 kcal</span>
    <span class="kcal-left" id="kcal-left"></span>
  </div>
  <div class="bar kcal-bar"><div id="kcal-bar" style="width:0%; background:var(--bar-k)"></div></div>
  <div class="macros">
    <div class="macro" id="macro-p"></div>
    <div class="macro" id="macro-f"></div>
    <div class="macro" id="macro-c"></div>
  </div>
</header>

<main id="log"></main>
</div>

<div class="view" id="view-rocket">
  <header>
    <div class="header-top">
      <div class="date-nav">
        <button id="r-prev-day" aria-label="前の日">‹</button>
        <div class="date-label" id="r-date-label"></div>
        <button id="r-next-day" aria-label="次の日">›</button>
      </div>
      <button class="kpi-btn" id="r-goal-open"></button>
    </div>
    <div class="kcal-row">
      <span class="kcal-now" id="r-total">0</span>
      <span class="kcal-goal" id="r-goal-label">/ 120 分</span>
      <span class="kcal-left" id="r-left"></span>
    </div>
    <div class="bar kcal-bar"><div id="r-bar" style="width:0%; background:var(--bar-k)"></div></div>
    <div class="criteria-head">
      <span>ゆずれない3つ</span>
      <span class="streak" id="r-streak"></span>
    </div>
    <div class="criteria" id="criteria"></div>
    <div class="tl-head">
      <span>ここからの道のり</span>

<script>
const STORE_KEY = 'pfc-log-v1';

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalizeStore(JSON.parse(raw));
  } catch (e) {}
  return normalizeStore({});
}

// 後から増えた項目を、既存の保存データにも欠けたまま使わせない
function normalizeStore(s) {
  if (!s || typeof s !== 'object') s = {};
  if (!s.kpi || typeof s.kpi !== 'object') s.kpi = { k: 2100, p: 175, f: 55, c: 225 };
  if (!Array.isArray(s.entries)) s.entries = [];
  if (!Array.isArray(s.acts)) s.acts = [];
  if (!Array.isArray(s.gym)) s.gym = [];
  if (!Array.isArray(s.pinnedFoods)) s.pinnedFoods = [];
  if (!Array.isArray(s.planNew)) s.planNew = [];
  if (!s.measured) s.measured = null;
  if (!Array.isArray(s.hiddenFoods)) s.hiddenFoods = [];
  if (!s.gymBase) s.gymBase = { year: 2026, asOf: '2026-08-05', count: 49 };
  if (typeof s.gymYearGoal !== 'number') s.gymYearGoal = 135;
  if (typeof s.actGoal !== 'number' || !(s.actGoal > 0)) s.actGoal = 120;
  if (!Array.isArray(s.criteria) || s.criteria.length !== 3) {
    s.criteria = ['年収900万', '周囲の5人', '配置リスク無し'];
  }
  if (!Array.isArray(s.milestones) || !s.milestones.length) {
    s.milestones = [
      { on: '2026-10-15', when: '10月中旬', what: '内定' },
      { on: '2026-10-31', when: '10末', what: '退職申し出' },
      { on: '2026-11-30', when: '11末', what: '退社' },
      { on: '2026-12-01', when: '12/1', what: '入社' }
    ];
  }
  return s;
}
function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

// 日付ごとの索引と最近の食品を持っておき、描画の手間が記録の総数に左右されないようにする。
let byDate = new Map();
let recentCache = null;
let actsByDate = new Map();

function indexEntries() {
  byDate = new Map();
  for (const e of store.entries) {
    const list = byDate.get(e.date);
    if (list) list.push(e);
    else byDate.set(e.date, [e]);
  }
  recentCache = null;
}

function indexActs() {
  actsByDate = new Map();
  for (const a of store.acts) {
    const list = actsByDate.get(a.date);
    if (list) list.push(a);
    else actsByDate.set(a.date, [a]);
  }
}

function actsFor(dateStr) {
  return actsByDate.get(dateStr) || [];
}

let gymByDate = new Map();

function indexGym() {
  gymByDate = new Map();
  for (const g of store.gym) {
    const list = gymByDate.get(g.date);
    if (list) list.push(g);
    else gymByDate.set(g.date, [g]);
  }
}

function gymFor(dateStr) {
  return gymByDate.get(dateStr) || [];
}

let store = loadStore();

function todayStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
let viewDate = todayStr();

const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
function formatDateLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const label = `${m}月${d}日 (${WEEKDAYS[dt.getDay()]})`;
  return dateStr === todayStr() ? label + ' 今日' : label;
}
function shiftDate(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d + days);
  return todayStr(dt);
}

function parseEntry(text) {
  const tokens = text.trim().split(/\s+/);
  if (!tokens.length) return null;
  const entry = { name: '', k: null, p: 0, f: 0, c: 0 };
  const nameParts = [];
  for (const t of tokens) {
    let m;
    if ((m = t.match(/^(\d+(?:\.\d+)?)k(?:cal)?$/i))) entry.k = parseFloat(m[1]);
    else if ((m = t.match(/^[pP](\d+(?:\.\d+)?)$/))) entry.p = parseFloat(m[1]);
    else if ((m = t.match(/^[fF](\d+(?:\.\d+)?)$/))) entry.f = parseFloat(m[1]);
    else if ((m = t.match(/^[cC](\d+(?:\.\d+)?)$/))) entry.c = parseFloat(m[1]);
    else nameParts.push(t);
  }
  entry.name = nameParts.join(' ');
  if (!entry.name) return null;
  if (entry.k === null) {
    if (entry.p === 0 && entry.f === 0 && entry.c === 0) return null;
    entry.k = Math.round(entry.p * 4 + entry.f * 9 + entry.c * 4);
    entry.estimated = true;
  }
  return entry;
}

function entriesFor(dateStr) {
  return byDate.get(dateStr) || [];
}

// 「1045」「9:30」のどちらの書き方も0時からの分数に直す
function toMinutes(token) {
  let m;
  if ((m = token.match(/^(\d{1,2}):(\d{2})$/))) {
    const h = +m[1], mi = +m[2];
    return h < 24 && mi < 60 ? h * 60 + mi : null;
  }
  if ((m = token.match(/^(\d{3,4})$/))) {
    const h = +m[1].slice(0, -2), mi = +m[1].slice(-2);
    return h < 24 && mi < 60 ? h * 60 + mi : null;
  }
  return null;
}

function fmtClock(v) {
  return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
}

function parseActivity(text) {
  const tokens = text.trim().split(/\s+/).filter(Boolean);
  const times = [], nameParts = [];
  for (const t of tokens) {
    const v = toMinutes(t);
    if (v !== null && times.length < 2) times.push(v);
    else nameParts.push(t);
  }
  if (times.length !== 2 || !nameParts.length) return null;
  const [start, end] = times;
  let minutes = end - start;
  if (minutes < 0) minutes += 1440; // 日付をまたいだ場合
  return { name: nameParts.join(' '), start, end, minutes };
}

function minutesOn(dateStr) {
  return actsFor(dateStr).reduce((sum, a) => sum + a.minutes, 0);
}

// 今日が未達のうちは、昨日までの連続を数える(日中に途切れた表示にしない)
function streakDays() {
  const goal = store.actGoal;
  let d = todayStr();
  if (minutesOn(d) < goal) d = shiftDate(d, -1);
  let n = 0;
  while (minutesOn(d) >= goal) {
    n++;
    d = shiftDate(d, -1);
  }
  return n;
}

// 「フライ 20×10→16×10」のような書き方をそのまま受ける。表記は崩さず保存する。
function parseGym(text) {
  const raw = text.trim().replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let i = raw.search(/\d/);
  if (i <= 0) return null;
  // 「f10×20」「b10×20」のように数字の前に1文字付く書き方も、種目名ではなくセットとして扱う
  if (/[a-zA-Z]/.test(raw[i - 1]) && (i === 1 || /\s/.test(raw[i - 2]))) i -= 1;
  if (i <= 0) return null;
  const name = raw.slice(0, i).trim();
  const setsText = raw.slice(i).trim();
  if (!name || !setsText) return null;

  const parts = setsText.split(/[,、，\n]|→|->/).map(x => x.trim()).filter(Boolean);
  let volume = 0, allWeighted = true;
  for (const part of parts) {
    const m = part.match(/^[a-zA-Z]?\s*(\d+(?:\.\d+)?)\s*[×xX*✕]\s*(\d+(?:\.\d+)?)/);
    if (m) volume += parseFloat(m[1]) * parseFloat(m[2]);
    else allWeighted = false;
  }
  if (name === '睡眠') {
    const t = setsText.split(/[-–—~〜\s]+/).map(x => toMinutes(x)).filter(v => v !== null);
    if (t.length === 2) {
      let mins = t[1] - t[0];
      if (mins < 0) mins += 1440;
      return { name, sets: setsText, count: 0, volume: 0, distance: 0, sleep: mins };
    }
  }

  let distance = 0;
  const km = /(\d+(?:\.\d+)?)\s*(?:km|KM|Km|kM|㎞|キロ)/g;
  let d;
  while ((d = km.exec(setsText))) distance += parseFloat(d[1]);

  // トルソー(lr)は左右それぞれ行うので重量は2倍で数える
  if (name === 'トルソー(lr)') volume *= 2;

  return { name, sets: setsText, count: parts.length, volume: allWeighted ? Math.round(volume) : 0, distance: Math.round(distance * 10) / 10 };
}

// 月曜はじまりの週の初日を返す
function weekStart(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const back = (new Date(y, m - 1, d).getDay() + 6) % 7;
  return todayStr(new Date(y, m - 1, d - back));
}

// 何日ジムに行ったかを数える（同じ日に何種目やっても1日）
function gymDaysBetween(from, to) {
  const days = new Set();
  for (const g of store.gym) {
    if (!g.memo && !g.sleep && g.date >= from && g.date <= to) days.add(g.date);
  }
  return days.size;
}

// 年間累計。起点より後に記録された日を足していく。
function gymYearCount(year) {
  const base = store.gymBase;
  const from = (year === base.year) ? base.asOf : `${year}-01-01`;
  const after = new Set();
  for (const g of store.gym) {
    if (!g.memo && !g.sleep && g.date > from && g.date <= `${year}-12-31`) after.add(g.date);
  }
  return (year === base.year ? base.count : 0) + after.size;
}

const PLAN_BASE = { w0: 105, bf0: 0.35, fatShare: 0.9, waist0: 110, thigh0: 74, kWaist: 0.975, kThigh: 0.44, rate: 0.005, target: 76.5 };

function planBand(kg, key) {
  const above = PLAN_OLD.filter(r => r.kg >= kg);
  const src = above.length ? above.reduce((a, b) => (a.kg <= b.kg ? a : b)) : PLAN_OLD[PLAN_OLD.length - 1];
  return src[key];
}

// 今週から実測体重で引き直す。過去の行は従来のまま残す。
function rebuildPlan(actualKg) {
  const B = PLAN_BASE, today = todayStr();
  let start = 0;
  PLAN_OLD.forEach((r, i) => { if (r.d <= today) start = i; });
  const rows = PLAN_OLD.slice(0, start).map(r => ({ ...r }));
  let w = actualKg, i = start;
  while (true) {
    const lost = B.w0 - w;
    rows.push({
      d: shiftDate(PLAN_OLD[start].d, (i - start) * 7),
      w: i,
      kg: Math.round(w * 2) / 2,
      bf: Math.round((B.w0 * B.bf0 - lost * B.fatShare) / w * 1000) / 10,
      kcal: planBand(w, 'kcal'),
      waist: Math.round((B.waist0 - lost * B.kWaist) * 10) / 10,
      thigh: Math.round((B.thigh0 - lost * B.kThigh) * 10) / 10,
      size: planBand(w, 'size')
    });
    if (w <= B.target || i - start > 400) break;
    w = w * (1 - B.rate);
    i++;
  }
  return rows;
}

  const today = todayStr();

  document.getElementById('b-head').innerHTML = `

// 指定した日数分をまとめて採点する（食事・Rocket・GYMを各100点、平均が総合）
function scoreDays(list) {
  const clamp = v => Math.max(0, Math.min(1, v));
  const per = list.map(d => entriesFor(d).reduce((a, e) => ({ k: a.k + e.k, p: a.p + e.p }), { k: 0, p: 0 }));
  const logged = per.filter(d => d.k > 0).length;
  const avgK = logged ? per.reduce((a, d) => a + d.k, 0) / logged : 0;
  const avgP = logged ? per.reduce((a, d) => a + d.p, 0) / logged : 0;
  const food = Math.round(50 * clamp(1 - Math.max(0, avgK - store.kpi.k) / store.kpi.k * 3) + 50 * clamp(store.kpi.p ? avgP / store.kpi.p : 0));
  const min = list.reduce((a, d) => a + actsFor(d).reduce((x, g) => x + g.minutes, 0), 0);
  const rocket = Math.round(100 * clamp(min / (store.actGoal * list.length)));
  const gDays = list.filter(d => gymFor(d).some(g => !g.memo && !g.sleep)).length;
  const gym = Math.round(100 * clamp(gDays / (4 * list.length / 7)));
  return Math.round((food + rocket + gym) / 3);
}

function renderWeekly() {
  // 曜日に関係なく、その日から遡って7日間
  const from = shiftDate(todayStr(), -6);
  const days = Array.from({ length: 7 }, (_, i) => shiftDate(from, i));
  const label = d => {
    const [y, m, dd] = d.split('-').map(Number);
    return `${m}/${dd}(${WEEKDAYS[new Date(y, m - 1, dd).getDay()]})`;
  };
  document.getElementById('w-label').textContent = `　${label(from)} − ${label(days[6])}`;
  // 今月1日から本日まで（未到来の日は含めない）
  const dayOfMonth = Number(todayStr().slice(8));
  const month = Array.from({ length: dayOfMonth }, (_, i) => `${todayStr().slice(0, 8)}${String(i + 1).padStart(2, '0')}`);
  const monthly = scoreDays(month);

  const perDay = days.map(d => entriesFor(d).reduce((a, e) => ({ k: a.k + e.k, p: a.p + e.p, f: a.f + e.f, c: a.c + e.c }), { k: 0, p: 0, f: 0, c: 0 }));
  const sum = perDay.reduce((a, b) => ({ k: a.k + b.k, p: a.p + b.p, f: a.f + b.f, c: a.c + b.c }), { k: 0, p: 0, f: 0, c: 0 });
  const logged = perDay.filter(d => d.k > 0).length;
  const kcalAvg = logged ? Math.round(sum.k / logged) : 0;

  const pc = sum.p * 4, fc = sum.f * 9, cc = sum.c * 4, tot = pc + fc + cc;
  const R = 46, C = 2 * Math.PI * R;
  let offset = 0;
  const arc = (val, color) => {
    const len = tot ? (val / tot) * C : 0;
    const el = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${color}" stroke-width="20" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 60 60)"/>`;
    offset += len;
    return el;
  };
  const donut = tot
    ? `<svg width="120" height="120" viewBox="0 0 120 120">${arc(pc, '#378ADD')}${arc(fc, '#EF9F27')}${arc(cc, '#1D9E75')}</svg>`
    : `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--track)" stroke-width="20"/></svg>`;
  const pct = v => tot ? Math.round(v / tot * 100) : 0;

  const actMin = days.reduce((a, d) => a + actsFor(d).reduce((x, g) => x + g.minutes, 0), 0);
  const actDays = days.filter(d => actsFor(d).length).length;
  const gymDays = days.filter(d => gymFor(d).some(g => !g.memo && !g.sleep)).length;
  const vol = Math.round(days.reduce((a, d) => a + gymFor(d).reduce((x, g) => x + g.volume, 0), 0) / 100) * 100;
  const dist = Math.round(days.reduce((a, d) => a + gymFor(d).reduce((x, g) => x + (g.distance || 0), 0), 0) * 10) / 10;

  // 総合スコア（食事40・Rocket30・GYM30）
  const clamp = v => Math.max(0, Math.min(1, v));
  const avgP = logged ? sum.p / logged : 0;
  const kcalScore = 50 * clamp(1 - Math.max(0, kcalAvg - store.kpi.k) / store.kpi.k * 3);
  const pScore = 50 * clamp(store.kpi.p ? avgP / store.kpi.p : 0);
  const sFood = Math.round(kcalScore + pScore);
  const sRocket = Math.round(100 * clamp(actMin / (store.actGoal * 7)));
  const sGym = Math.round(100 * clamp(gymDays / 4));
  const score = Math.round((sFood + sRocket + sGym) / 3);

  // 目標を超えたら赤、収まっていれば青（Pだけ逆）
  const BLUE = '#185FA5', RED = '#EE8A89';
  const under = (v, goal) => (v > goal ? RED : '');
  const over = (v, goal) => (v >= goal ? '' : RED);
  const avgPv = logged ? Math.round(sum.p / logged) : 0;
  const avgFv = logged ? Math.round(sum.f / logged) : 0;
  const avgCv = logged ? Math.round(sum.c / logged) : 0;

  // 睡眠の損益。1日7時間を標準に、記録した日をすべて積み上げる。
  const byDay = new Map();
  for (const g of store.gym) {
    if (!g.sleep) continue;
    byDay.set(g.date, (byDay.get(g.date) || 0) + g.sleep);
  }
  const sleepDays = byDay.size;
  const balance = [...byDay.values()].reduce((a, v) => a + (v - 420), 0);
  const sign = balance < 0 ? '−' : '+';
  const absMin = Math.abs(balance);
  const balH = Math.floor(absMin / 60), balM = absMin % 60;

  const maxK = Math.max(store.kpi.k, ...perDay.map(d => d.k)) || 1;
  const bars = perDay.map((d, i) => `<div class="wk-bar">
      <i style="height:${Math.round(d.k / maxK * 86)}px; background:${d.k > store.kpi.k ? '#EE8A89' : 'var(--text)'}"></i>
      <em>${WD[new Date(...days[i].split('-').map((v, j) => j === 1 ? v - 1 : +v)).getDay()]}</em></div>`).join('');

  document.getElementById('w-log').innerHTML = `
    <div class="wk-split">
      <div class="wk-card">
        <div class="wk-title" style="display:flex; align-items:baseline"><span>総合スコア</span><span class="w-monthly">月間スコア ${monthly}</span></div>
        <div class="wk-score"><b>${score}</b><span>点 / 100</span></div>
        <div class="wk-score-bd">
          <div><span class="wk-dot" style="background:#378ADD"></span>食事<b>${sFood} / 100</b></div>
          <div><span class="wk-dot" style="background:#17B45E"></span>Rocket<b>${sRocket} / 100</b></div>
          <div><span class="wk-dot" style="background:#6A1B9A"></span>GYM<b>${sGym} / 100</b></div>
        </div>
      </div>
      <div class="wk-card wk-sleep">
        <div class="wk-sleep-t">Sleep</div>
        <div class="wk-sleep-v">${sleepDays ? `${sign} ${balH}時間${balM ? ' ' + balM + '分' : ''}` : '—'}</div>
      </div>
    </div>
    <div class="wk-card">
      <div class="wk-title">1日のカロリー（目標 ${store.kpi.k}）</div>
      <div class="wk-bars">${bars}</div>
    </div>
    <div class="wk-card">
      <div class="wk-stats" style="grid-template-columns: repeat(4, 1fr)">
        <div class="wk-stat"><span>Ave. kcal</span><b style="color:${under(kcalAvg, store.kpi.k)}">${kcalAvg}</b></div>
        <div class="wk-stat"><span>Ave. P</span><b style="color:${over(avgPv, 135)}">${avgPv}</b></div>
        <div class="wk-stat"><span>Ave. F</span><b style="color:${under(avgFv, store.kpi.f)}">${avgFv}</b></div>
        <div class="wk-stat"><span>Ave. C</span><b style="color:${under(avgCv, 250)}">${avgCv}</b></div>
      </div>
    </div>
    <div class="wk-card">
      <div class="wk-title">Rocket</div>
      <div class="wk-stats">
        <div class="wk-stat"><span>活動時間</span><b>${Math.floor(actMin / 60)}時間${actMin % 60}分</b></div>
        <div class="wk-stat"><span>活動した日</span><b>${actDays}</b></div>
        <div class="wk-stat"><span>Ave. 分/日</span><b style="color:${Math.round(actMin / 7) < store.actGoal ? RED : ''}">${Math.round(actMin / 7)}分</b></div>
      </div>
    </div>
    <div class="wk-card">
      <div class="wk-title">GYM</div>
      <div class="wk-stats">
        <div class="wk-stat"><span>行った日</span><b>${gymDays} / 4</b></div>
        <div class="wk-stat"><span>総量</span><b>${vol.toLocaleString()}kg</b></div>
        <div class="wk-stat"><span>総距離</span><b>${dist}km</b></div>
      </div>
    </div>`;
}


const EXERCISES = ['睡眠','フリーベンチ','ウェイトスクワット','フライ','内転筋','サイドスクワット','fラウンジ','bラウンジ','フロントスクワット','プル','トルソー(lr)','体幹','レッグアップ','バイシクル','レッグカール','クロバタ','ボール','ロウ','インチワーム','ショル','バイク'];

// 一昨日から今日までに出てこなかった種目を出す
const SHORT_SPAN = ['トルソー(lr)','体幹','レッグアップ','バイシクル','ボール','インチワーム','クロバタ'];

function renderGymTodo() {
  const doneSince = span => {
    const from = shiftDate(viewDate, span);
    const done = [];
    for (const g of store.gym) {
      if (!g.memo && g.date >= from && g.date <= viewDate) done.push(g.name);
    }
    return done;
  };
  const done2 = doneSince(-2), done1 = doneSince(-1);
  const missing = EXERCISES.filter(name => {
    if (name === '睡眠') return true; // 睡眠は常に置いておく
    const done = SHORT_SPAN.includes(name) ? done1 : done2;
    return !done.some(d => d.includes(name) || name.includes(d));
  });
  const row = document.getElementById('gym-todo');
  row.style.display = missing.length ? 'flex' : 'none';
  row.innerHTML = missing.map(n => `<button class="recent-chip${n === '睡眠' ? ' sleep' : ''}">${escapeHtml(n)}</button>`).join('');
}

document.getElementById('gym-todo').addEventListener('click', e => {

function daysUntil(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [ty, tm, td] = todayStr().split('-').map(Number);
  return Math.round((new Date(y, m - 1, d) - new Date(ty, tm - 1, td)) / 86400000);
}

function renderTimeline() {
  const today = todayStr();
  const nextIndex = store.milestones.findIndex(ms => ms.on >= today);

  document.getElementById('timeline').innerHTML = store.milestones.map((ms, i) => {
    const state = ms.on < today ? 'done' : (i === nextIndex ? 'next' : '');
    return `
      <div class="tl-step ${state}">
        <div class="tl-dot"></div>
        <div class="tl-when">${escapeHtml(ms.when)}</div>
        <div class="tl-what">${escapeHtml(ms.what)}</div>
      </div>`;
  }).join('');

  const countdown = document.getElementById('tl-countdown');
  if (nextIndex === -1) {
    countdown.textContent = '';
    return;
  }
  const next = store.milestones[nextIndex];
  const days = daysUntil(next.on);
  countdown.textContent = days === 0 ? `${next.what}は今日` : `${next.what}まで あと${days}日`;
}

function macroHtml(label, now, goal, barColor) {
  const pct = Math.min(100, goal > 0 ? (now / goal) * 100 : 0);
  const over = now > goal;
  // タンパク質は超過しても困らないので警告色にしない
  const warn = over && label !== 'P';
  const left = goal - now;
  let note, noteClass;
  if (over) { note = warn ? `${fmt(now - goal)}g超過` : ''; noteClass = warn ? 'over' : 'ok'; }
  else { note = `あと${fmt(left)}g`; noteClass = label === 'P' ? 'ok' : ''; }
  return `
    <div class="macro-head">
      <span class="label">${label}</span>
      <span class="val">${fmt(now)}<span class="goal">/${goal}</span></span>
    </div>
    <div class="bar"><div style="width:${pct}%; background:${warn ? 'var(--over)' : barColor}"></div></div>
    <div class="macro-note ${noteClass}">${note}</div>`;
}

function fmt(n) { return Math.round(n * 10) / 10; }

// PFCの集計は5の倍数に丸めて表示する
function round5(n) { return Math.round(n / 5) * 5; }

function render() {
  const kpi = store.kpi;
  const entries = entriesFor(viewDate);
  const raw = entries.reduce((a, e) => ({ k: a.k + e.k, p: a.p + e.p, f: a.f + e.f, c: a.c + e.c }), { k: 0, p: 0, f: 0, c: 0 });
  const total = { k: round5(raw.k), p: raw.p, f: raw.f, c: raw.c };

  document.getElementById('date-label').textContent = formatDateLabel(viewDate);
  document.getElementById('kpi-open').textContent = 'KPI管理';
  document.getElementById('kcal-now').textContent = fmt(total.k);
  document.getElementById('kcal-goal').textContent = `/ ${kpi.k} kcal`;

  const kLeft = kpi.k - total.k;
  const kcalLeftEl = document.getElementById('kcal-left');
  if (kLeft >= 0) { kcalLeftEl.textContent = `残り ${fmt(kLeft)}`; kcalLeftEl.style.color = 'var(--ok)'; }
  else { kcalLeftEl.textContent = `${fmt(-kLeft)} オーバー`; kcalLeftEl.style.color = 'var(--over)'; }

  const kcalBar = document.getElementById('kcal-bar');
  kcalBar.style.width = Math.min(100, kpi.k > 0 ? (total.k / kpi.k) * 100 : 0) + '%';
  kcalBar.style.background = total.k > kpi.k ? 'var(--over)' : 'var(--bar-k)';

  document.getElementById('macro-p').innerHTML = macroHtml('P', total.p, kpi.p, 'var(--bar-p)');
  document.getElementById('macro-f').innerHTML = macroHtml('F', total.f, kpi.f, 'var(--bar-f)');
  document.getElementById('macro-c').innerHTML = macroHtml('C', total.c, kpi.c, 'var(--bar-c)');

  renderRecents();
  const log = document.getElementById('log');
  if (!entries.length) {
    log.innerHTML = `<div class="empty">まだ記録がありません<br>下の欄に「サラダチキン 110k p24 f1 c0」のように入力</div>`;
    return;
  }
  log.innerHTML = entries.map(e => `
    <div class="entry">
      <span class="time edit" data-id="${e.id}">${e.time}</span>
      <div class="body">
        <span class="name">${escapeHtml(e.name)}${e.mult && e.mult !== 1 ? `<span class="mult-badge">×${e.mult}</span>` : ''}</span>
        ${e.memo ? '' : `<span class="pfc mono">${fmt(e.k)}k${e.estimated ? '*' : ''}   p${fmt(e.p)}   f${fmt(e.f)}   c${fmt(e.c)}</span>`}
      </div>
      <button class="del" data-id="${e.id}" aria-label="削除">×</button>
    </div>`).join('');
}

function recentFoods() {
  if (recentCache) return recentCache;
  const seen = new Set();
  const out = store.pinnedFoods.map(f => ({ ...f, pinned: true }));
  out.forEach(f => seen.add(f.name));
  for (let i = store.entries.length - 1; i >= 0 && out.length < 30; i--) {
    const e = store.entries[i];
    if (e.memo) continue;
    if (seen.has(e.name)) continue;
    seen.add(e.name);
    const hidden = store.hiddenFoods.find(h => h.name === e.name);
    if (hidden && hidden.id === e.id) continue;
    let { k, p, f, c } = e;
    if (e.mult && e.mult !== 1) {
      k = Math.round(k / e.mult);
      p = Math.round(p / e.mult);
      f = Math.round(f / e.mult);
      c = Math.round(c / e.mult);
    }
    out.push({ name: e.name, k, p, f, c });
  }
  recentCache = out;
  return out;
}

function renderRecents() {
  const row = document.getElementById('recent-row');
  const foods = recentFoods();
  row.style.display = foods.length ? 'flex' : 'none';
  row.innerHTML = foods.map((r, i) => `<button class="recent-chip${r.pinned ? ' pinned' : ''}" data-i="${i}">${escapeHtml(r.name)}</button>`).join('');
  row._foods = foods;
}

// 長押しで候補から消す
let chipTimer = null, chipRemoved = false;
const recentRow = document.getElementById('recent-row');

recentRow.addEventListener('pointerdown', e => {
  const chip = e.target.closest('.recent-chip');
  if (!chip) return;
  chipRemoved = false;
  chipTimer = setTimeout(() => {
    chipTimer = null;
    chipRemoved = true;
    const food = recentRow._foods[Number(chip.dataset.i)];
    if (!food) return;
    if (food.pinned) {
      if (!confirm(`「${food.name}」の固定を解除しますか`)) return;
      store.pinnedFoods = store.pinnedFoods.filter(f => f.name !== food.name);
    } else if (confirm(`「${food.name}」を固定しますか（キャンセルすると削除に進みます）`)) {
      store.pinnedFoods.push({ name: food.name, k: food.k, p: food.p, f: food.f, c: food.c });
    } else if (confirm(`「${food.name}」を候補から消しますか`)) {
      const newest = [...store.entries].reverse().find(en => en.name === food.name);
      store.hiddenFoods = store.hiddenFoods.filter(h => h.name !== food.name);
      if (newest) store.hiddenFoods.push({ name: food.name, id: newest.id });
    } else {
      return;
    }
    recentCache = null;
    saveStore();
    render();
  }, 500);
});
['pointerup', 'pointercancel', 'pointerleave', 'pointermove'].forEach(t =>
  recentRow.addEventListener(t, () => { if (chipTimer) { clearTimeout(chipTimer); chipTimer = null; } }));

document.getElementById('recent-row').addEventListener('click', e => {
  if (chipRemoved) { chipRemoved = false; return; }
  const chip = e.target.closest('.recent-chip');
  if (!chip) return;
  const r = document.getElementById('recent-row')._foods[Number(chip.dataset.i)];
  if (!r) return;
  document.getElementById('food-input').value = `${r.name} ${r.k}k p${r.p} f${r.f} c${r.c}`;
  updateMultUI();
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

// 入力中は2行分を確保し、内容が増えたら4行分まで伸ばす。それ以上は中でスクロールさせる。
const INPUT_MIN = 61, INPUT_MAX = 101;

function fitInput(el) {
  if (document.activeElement !== el && !el.value) { el.style.height = ''; return; }
  el.style.height = 'auto';
  el.style.height = Math.min(Math.max(el.scrollHeight + 1, INPUT_MIN), INPUT_MAX) + 'px';
}

document.querySelectorAll('.line-input').forEach(el => {
  ['input', 'focus'].forEach(t => el.addEventListener(t, () => fitInput(el)));
  el.addEventListener('blur', () => fitInput(el));
});

const input = document.getElementById('food-input');
const hint = document.getElementById('hint');

const multBtn = document.getElementById('mult-btn');
const multPanel = document.getElementById('mult-panel');
const multRange = document.getElementById('mult-range');
const multVal = document.getElementById('mult-val');
const multPreview = document.getElementById('mult-preview');
let mult = 1;

function multLabel() { return '×' + mult.toFixed(1); }

function updateMultUI() {
  multBtn.textContent = multLabel();
  multBtn.classList.toggle('active', mult !== 1);
  multVal.textContent = multLabel();
  const parsed = parseEntry(input.value);
  if (parsed && mult !== 1) {
    multPreview.textContent = `→ ${Math.round(parsed.k * mult)}k p${Math.round(parsed.p * mult)} f${Math.round(parsed.f * mult)} c${Math.round(parsed.c * mult)}`;
  } else {
    multPreview.textContent = '';
  }
}

multBtn.addEventListener('click', () => {
  multPanel.classList.toggle('open');
  updateMultUI();
});
multRange.addEventListener('input', () => {
  mult = Math.round(parseFloat(multRange.value) * 10) / 10;
  updateMultUI();
});
input.addEventListener('input', updateMultUI);

function resetMult() {
  mult = 1;
  multRange.value = 1;
  multPanel.classList.remove('open');
  updateMultUI();
}

function showHint(msg, isError) {
  hint.textContent = msg;
  hint.classList.toggle('error', !!isError);
}

function submit() {
  const text = input.value;
  if (!text.trim()) return;
  const parsed = parseEntry(text);
  if (!parsed) {
    const now0 = new Date();
    const memo = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), date: viewDate,
      time: `${String(now0.getHours()).padStart(2, '0')}:${String(now0.getMinutes()).padStart(2, '0')}`,
      name: text.trim(), memo: true, k: 0, p: 0, f: 0, c: 0 };
    store.entries.push(memo);
    const bk = byDate.get(memo.date);
    if (bk) bk.push(memo); else byDate.set(memo.date, [memo]);
    saveStore();
    input.value = ''; fitInput(input);
    showHint('メモとして記録しました（集計には入りません）', false);
    render();
    return;
  }
  const appliedMult = mult;
  if (appliedMult !== 1) {
    parsed.k = Math.round(parsed.k * appliedMult);
    parsed.p = Math.round(parsed.p * appliedMult);
    parsed.f = Math.round(parsed.f * appliedMult);
    parsed.c = Math.round(parsed.c * appliedMult);
    parsed.mult = appliedMult;
  }
  const now = new Date();
  const entry = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    date: viewDate,
    time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
    ...parsed
  };
  store.entries.push(entry);
  const bucket = byDate.get(entry.date);
  if (bucket) bucket.push(entry);
  else byDate.set(entry.date, [entry]);
  recentCache = null;
  saveStore();
  input.value = '';
  fitInput(input);
  resetMult();
  if (appliedMult !== 1) showHint(`×${appliedMult} を適用して追加しました`, false);
  else showHint(parsed.estimated ? 'kcal未入力のためPFCから概算しました (*)' : 'いつもの書き方でそのまま送信 — 集計は自動', false);
  render();
  window.scrollTo(0, document.body.scrollHeight);
}

document.getElementById('send-btn').addEventListener('click', submit);
input.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  submit();
});

document.getElementById('log').addEventListener('click', e => {
  const t = e.target.closest('.time.edit');
  if (t) {
    const entry = store.entries.find(en => en.id === t.dataset.id);
    if (!entry) return;
    const input = prompt('時刻を編集 (例 12:30)', entry.time);
    if (input === null) return;
    const m = input.trim().match(/^(\d{1,2}):?(\d{2})$/);
    if (!m || +m[1] > 23 || +m[2] > 59) { showHint('時刻は 12:30 の形式で入力', true); return; }
    entry.time = `${m[1].padStart(2, '0')}:${m[2]}`;
    saveStore();
    render();
    return;
  }
  const btn = e.target.closest('.del');
  if (!btn) return;
  store.entries = store.entries.filter(en => en.id !== btn.dataset.id);
  indexEntries();
  saveStore();
  render();
});

// 日付は2つの画面で共有するので、どちらで動かしても両方を描き直す
function goToDate(dateStr) {

const gymInput = document.getElementById('gym-input');
const gymHint = document.getElementById('gym-hint');

function submitGym() {

document.getElementById('g-log').addEventListener('click', e => {

const backupExport = document.getElementById('backup-export');
const backupImport = document.getElementById('backup-import');
const backupFile = document.getElementById('backup-file');
const backupNote = document.getElementById('backup-note');
let pendingRestore = null;

function noteBackup(msg, isError) {
  backupNote.textContent = msg;
  backupNote.classList.toggle('error', !!isError);
}
function resetBackupUI() {
  pendingRestore = null;
  backupImport.textContent = '読み込み';
  noteBackup('記録とKPIをJSONファイルとして保存/復元できます。', false);
}

function fallbackDownload(filename, data) {
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  noteBackup('バックアップを保存しました。', false);
}

backupExport.addEventListener('click', () => {
  const data = JSON.stringify(store, null, 2);
  const filename = `pfc-log-backup-${todayStr()}.json`;
  if (window.claude && window.claude.downloads) {
    window.claude.downloads.save({ filename, data }).then(() => {
      noteBackup('バックアップを保存しました。', false);
    }).catch(err => {
      const code = err && err.code;
      if (code === 'declined') noteBackup('保存をキャンセルしました。', false);
      else if (code === 'rate_limited') noteBackup('少し待ってからもう一度試してください。', true);
      else fallbackDownload(filename, data);
    });
  } else {
    fallbackDownload(filename, data);
  }
});

backupImport.addEventListener('click', () => {
  if (pendingRestore) {
    store = pendingRestore;
    indexEntries();
    indexActs();
    indexGym();
    saveStore();
    resetBackupUI();
    noteBackup('復元しました。', false);
    renderRocket();
    renderGym();
    render();
    return;
  }
  backupFile.click();
});

backupFile.addEventListener('change', () => {
  const file = backupFile.files[0];
  backupFile.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || typeof obj.kpi !== 'object' || !Array.isArray(obj.entries)) throw new Error('bad shape');
      pendingRestore = normalizeStore(obj);
      backupImport.textContent = `上書き実行 (${obj.entries.length}件)`;
      noteBackup('もう一度「上書き実行」を押すと、現在のデータをこのバックアップで置き換えます。', false);
    } catch (e) {
      noteBackup('ファイルを読み取れませんでした。書き出したJSONを選んでください。', true);
    }
  };
  reader.readAsText(file);
});

// 自動更新が届かないときのための手動の逃げ道。localStorageには触れないので記録は残る。
document.getElementById('refresh-app').addEventListener('click', async () => {
  const note = document.getElementById('refresh-note');
  note.textContent = '最新版を取得しています…';
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  location.reload();
});

const dialog = document.getElementById('kpi-dialog');

  document.getElementById('kpi-p').value = store.kpi.p;

  document.getElementById('kpi-c').value = store.kpi.c;
  document.getElementById('kpi-r').value = store.actGoal;
  store.criteria.forEach((c, i) => { document.getElementById('crit-' + i).value = c; });

}
document.getElementById('kpi-open').addEventListener('click', openSettings);

    k: Number(document.getElementById('kpi-k').value) || 2100,
    p: Number(document.getElementById('kpi-p').value) || 0,
    f: Number(document.getElementById('kpi-f').value) || 0,

  };

  renderRocket();
  renderGym();
  renderBody();
  renderWeekly();
});

renderWeekly();

// アプリ本体を端末にキャッシュして、起動時に通信の完了を待たないようにする。
if ('serviceWorker' in navigator) {
  // まだ操作していない画面なら黙って新版に入れ替える。触ったあとは勝手に消さず確認を出す。
  let touched = false;
  ['pointerdown', 'keydown'].forEach(type =>
    window.addEventListener(type, () => { touched = true; }, { capture: true, once: true }));

  // 更新の知らせは読み込み直後に届きうるので、待たずに受け口を開けておく
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'update-ready') return;
    if (!touched && !sessionStorage.getItem('pfc-reloaded')) {
      sessionStorage.setItem('pfc-reloaded', '1');
      location.reload();
      return;
    }
    document.getElementById('update-bar').hidden = false;
  });
  document.getElementById('update-btn').addEventListener('click', () => location.reload());

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });

  // アプリを再び開いたときにも更新を確認する(起動しっぱなしで数日使う場合の取りこぼし対策)
  let lastCheck = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - lastCheck < 5 * 60 * 1000) return;
    lastCheck = Date.now();
    navigator.serviceWorker.getRegistration().then(reg => reg && reg.update()).catch(() => {});
  });
}
