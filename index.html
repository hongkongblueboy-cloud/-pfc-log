<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PFC Log</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffeeee;
    --card: #ffffff;
    --row: #fbe6ec;
    --text: #2a001b;
    --text-2: #7d5f6d;
    --text-3: #ab9595;
    --border: rgba(42,0,27,0.11);
    --track: #f7dbe4;
    --bar-k: #7a0079;
    --bar-p: #b2007f;
    --bar-f: #9362bb;
    --bar-c: #472354;
    --note-p: #b2007f;
    --note-f: #6f4095;
    --note-c: #472354;
    --over: #f32086;
    --ok: #7a0079;
    --accent-text: #b2007f;
    --send: #2a001b;
    --send-fg: #ffeeee;
    --tab-pfc: #b2007f;
    --tab-rocket: #7a0079;
    --tab-gym: #5c357c;
    --tab-4: #8b6e6e;
    --tab-5: #6b0354;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card);
    border-bottom: 0.5px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 14px;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 2px;
    margin-bottom: 12px;
  }
  .kpi-btn { margin-left: auto; }
  .date-nav { display: flex; align-items: center; gap: 4px; }
  .date-nav button {
    background: none; border: none; color: var(--text-2);
    font-size: 18px; padding: 4px 8px; cursor: pointer; line-height: 1;
  }
  .date-label { font-size: 15px; font-weight: 600; min-width: 110px; text-align: center; white-space: nowrap; }
  .kpi-btn {
    background: none; border: none; color: var(--text-3);
    font-size: 12px; cursor: pointer; padding: 4px 0; white-space: pre;
  }
  .kcal-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
  .kcal-now { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
  .kcal-goal { font-size: 13px; color: var(--text-2); }
  .kcal-left { margin-left: auto; font-size: 13px; font-weight: 600; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .kcal-bar { margin-bottom: 14px; }
  .macros { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .criteria-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; letter-spacing: 0.1em; color: var(--text-3);
    margin-bottom: 7px;
  }
  .streak { font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--ok); }
  .criteria { display: flex; align-items: stretch; }
  .criterion {
    flex: 1 1 0; min-width: 0; text-align: center;
    font-size: 12px; font-weight: 600; color: var(--text);
    line-height: 1.45; padding: 0 4px; word-break: break-word;
    border-left: 0.5px solid var(--border);
  }
  .criterion:first-child { border-left: none; }

  .tl-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; letter-spacing: 0.1em; color: var(--text-3);
    margin: 14px 0 9px; padding-top: 13px; border-top: 0.5px solid var(--border);
  }
  .tl-countdown { font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--text-2); }
  .timeline { display: flex; }
  .tl-step { flex: 1 1 0; min-width: 0; text-align: center; position: relative; }
  .tl-step::before, .tl-step::after {
    content: ''; position: absolute; top: 4px; height: 1px; background: var(--border);
  }
  .tl-step::before { left: 0; right: 50%; }
  .tl-step::after { left: 50%; right: 0; }
  .tl-step:first-child::before, .tl-step:last-child::after { display: none; }
  .tl-dot {
    position: relative; z-index: 1; width: 9px; height: 9px; border-radius: 50%;
    margin: 0 auto 6px; background: var(--bg); border: 1px solid var(--border);
  }
  .tl-when { font-size: 10px; color: var(--text-3); line-height: 1.3; }
  .tl-what { font-size: 11px; color: var(--text-3); font-weight: 600; line-height: 1.35; }
  .tl-step.done .tl-dot { background: var(--text-3); border-color: var(--text-3); }
  .tl-step.next .tl-dot { background: var(--ok); border-color: var(--ok); }
  .tl-step.next .tl-when { color: var(--text-2); }
  .tl-step.next .tl-what { color: var(--text); }
  .macro-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .macro-head .label { color: var(--text-2); font-weight: 600; }
  .macro-head .val { font-weight: 600; }
  .macro-head .goal { color: var(--text-3); font-weight: 400; }
  .macro .bar { height: 5px; }
  .macro-note { font-size: 11px; margin-top: 3px; color: var(--text-2); }
  .macro-note.over { color: var(--over); font-weight: 600; }
  .macro-note.ok { color: var(--accent-text); }

  main { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .empty {
    text-align: center; color: var(--text-3); font-size: 13px;
    padding: 48px 0; line-height: 1.8;
  }
  .empty b { display: block; font-size: 15px; color: var(--text-2); font-weight: 600; margin-bottom: 2px; }
  .empty-hint { display: block; margin-top: 10px; font-size: 11px; }
  .entry { display: flex; align-items: center; gap: 10px; }
  .entry .time { font-size: 11px; color: var(--text-3); min-width: 36px; text-align: right; }
  .entry .body {
    flex: 1; display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; row-gap: 2px;
    gap: 8px; padding: 9px 12px; background: var(--card); border-radius: 10px;
    border: 0.5px solid var(--border); min-width: 0;
  }
  .entry .name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .pfc { font-size: 12px; color: var(--text-2); white-space: pre; flex-shrink: 0; margin-left: auto; }
  .entry .del {
    background: none; border: none; color: var(--text-3); font-size: 16px;
    padding: 4px 6px; cursor: pointer; line-height: 1; flex-shrink: 0;
  }

  .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .view.active { display: flex; }

  .bottom {
    position: sticky;
    bottom: 0;
    background: var(--bg);
  }
  footer {
    background: var(--bg);
    padding: 8px 16px 12px;
  }
  footer[hidden] { display: none; }
  .tabbar {
    display: flex;
    background: var(--card);
    border-top: 0.5px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--text-3); padding: 13px 0 12px;
    border-top: 2px solid transparent; margin-top: -1px;
  }
  .tab.active { color: var(--text); border-top-color: var(--text); }
  .tab[data-view="pfc"].active { color: var(--tab-pfc); border-top-color: var(--tab-pfc); }
  .tab[data-view="rocket"].active { color: var(--tab-rocket); border-top-color: var(--tab-rocket); }
  .tab[data-view="gym"].active { color: var(--tab-gym); border-top-color: var(--tab-gym); }
  .input-row { display: flex; align-items: flex-end; gap: 8px; }
  #mult-btn {
    height: 40px; min-width: 48px; padding: 0 10px; border-radius: 20px;
    border: 0.5px solid var(--border); background: var(--card); color: var(--text-2);
    font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    font-family: inherit;
  }
  #mult-btn.active { color: var(--accent-text); border-color: var(--accent-text); }
  .mult-panel {
    display: none; background: var(--card); border: 0.5px solid var(--border);
    border-radius: 14px; padding: 12px 16px 14px; margin-bottom: 8px;
  }
  .mult-panel.open { display: block; }
  .mult-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--text-2); margin-bottom: 8px; gap: 8px;
  }
  .mult-head b { font-size: 15px; color: var(--text); }
  .mult-preview { font-size: 11px; color: var(--text-3); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mult-range { width: 100%; accent-color: var(--send); margin: 2px 0 0; }
  .mult-ticks {
    display: flex; justify-content: space-between; font-size: 10px;
    color: var(--text-3); margin-top: 2px; padding: 0 8px;
  }
  .entry .mult-badge {
    font-size: 11px; font-weight: 600; color: var(--accent-text);
    background: none; margin-left: 4px;
  }
  .line-input {
    flex: 1; border: 0.5px solid var(--border); background: var(--card);
    color: var(--text); font-size: 16px; padding: 10px 16px;
    border-radius: 22px; outline: none; min-width: 0;
    font-family: inherit;
    height: 41px; line-height: 20px; resize: none; overflow-y: hidden;
    transition: height 0.15s ease;
  }
  .line-input:focus { height: 61px; }
  .line-input::placeholder { color: var(--text-3); }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--send); color: var(--send-fg); font-size: 18px;
    cursor: pointer; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center;
  }
  .send-btn:active { transform: scale(0.94); }
  .recent-row {
    display: flex; gap: 6px; overflow-x: auto; margin-top: 8px;
    padding-bottom: 2px; scrollbar-width: none;
  }
  .recent-row::-webkit-scrollbar { display: none; }
  .recent-chip {
    flex-shrink: 0; padding: 6px 12px; border-radius: 16px;
    background: var(--card); border: 0.5px solid var(--border);
    font-size: 13px; color: var(--text-2); cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .recent-chip:active { transform: scale(0.97); }
  .update-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--card); border: 0.5px solid var(--border); border-radius: 14px;
    padding: 8px 12px; margin: 0 16px 8px; font-size: 12px; color: var(--text-2);
  }
  .update-bar[hidden] { display: none; }
  #update-btn {
    border: 0.5px solid var(--border); background: var(--row); color: var(--text);
    border-radius: 14px; font-size: 12px; font-weight: 600; padding: 5px 12px;
    cursor: pointer; font-family: inherit;
  }
  .hint { font-size: 11px; color: var(--text-3); text-align: center; margin-top: 8px; }
  .hint.error { color: var(--over); font-weight: 600; }

  dialog {
    border: none; border-radius: 16px; background: var(--card); color: var(--text);
    padding: 20px; width: min(90vw, 320px);
    margin: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,0.4); }
  dialog h2 { font-size: 16px; margin-bottom: 4px; }
  dialog p { font-size: 12px; color: var(--text-2); margin-bottom: 14px; }
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .kpi-field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .kpi-field input {
    width: 100%; border: 0.5px solid var(--border); background: var(--row);
    color: var(--text); font-size: 16px; padding: 8px 10px; border-radius: 8px; outline: none;
  }
  .backup-sec { border-top: 0.5px solid var(--border); margin-top: 4px; padding-top: 12px; margin-bottom: 16px; }
  .backup-title { font-size: 12px; color: var(--text-2); font-weight: 600; margin-bottom: 8px; }
  .backup-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn-backup {
    flex: 1; border: 0.5px solid var(--border); background: var(--row); color: var(--text);
    border-radius: 8px; font-size: 13px; font-weight: 600; padding: 9px 0;
    cursor: pointer; font-family: inherit;
  }
  .backup-note { font-size: 11px; color: var(--text-3); line-height: 1.5; }
  .backup-note.error { color: var(--over); }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .dialog-actions button {
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
    padding: 9px 16px; cursor: pointer;
  }
  .btn-cancel { background: var(--row); color: var(--text-2); }
  .btn-save { background: var(--send); color: var(--send-fg); }
</style>
</head>
<body>

<div class="view" id="view-pfc">
<header>
  <div class="header-top">
    <div class="date-nav">
      <button id="prev-day" aria-label="前の日">‹</button>
      <div class="date-label" id="date-label"></div>
      <button id="next-day" aria-label="次の日">›</button>
    </div>
    <button class="kpi-btn" id="kpi-open"></button>
  </div>
  <div class="kcal-row">
    <span class="kcal-now" id="kcal-now">0</span>
    <span class="kcal-goal" id="kcal-goal">/ 2100 kcal</span>
    <span class="kcal-left" id="kcal-left"></span>
  </div>
  <div class="bar kcal-bar"><div id="kcal-bar" style="width:0%; background:var(--tab-pfc)"></div></div>
  <div class="macros">
    <div class="macro" id="macro-p"></div>
    <div class="macro" id="macro-f"></div>
    <div class="macro" id="macro-c"></div>
  </div>
</header>

<main id="log"></main>
</div>

<div class="view" id="view-rocket">
  <header>
    <div class="header-top">
      <div class="date-nav">
        <button id="r-prev-day" aria-label="前の日">‹</button>
        <div class="date-label" id="r-date-label"></div>
        <button id="r-next-day" aria-label="次の日">›</button>
      </div>
      <button class="kpi-btn" id="r-goal-open"></button>
    </div>
    <div class="kcal-row">
      <span class="kcal-now" id="r-total">0</span>
      <span class="kcal-goal" id="r-goal-label">/ 120 分</span>
      <span class="kcal-left" id="r-left"></span>
    </div>
    <div class="bar kcal-bar"><div id="r-bar" style="width:0%; background:var(--tab-rocket)"></div></div>
    <div class="criteria-head">
      <span>ゆずれない3つ</span>
      <span class="streak" id="r-streak"></span>
    </div>
    <div class="criteria" id="criteria"></div>
    <div class="tl-head">
      <span>ここからの道のり</span>
      <span class="tl-countdown" id="tl-countdown"></span>
    </div>
    <div class="timeline" id="timeline"></div>
  </header>
  <main id="r-log"></main>
</div>

<div class="view" id="view-gym">
  <main><div class="empty"><b>GYM</b><br>この画面の中身はこれから作ります</div></main>
</div>

<div class="bottom">
<div class="update-bar" id="update-bar" hidden>
  <span>新しいバージョンがあります</span>
  <button id="update-btn">更新</button>
</div>
<footer id="pfc-footer">
  <div class="mult-panel" id="mult-panel">
    <div class="mult-head">
      <span>倍率 <b id="mult-val">×1.0</b></span>
      <span class="mult-preview" id="mult-preview"></span>
    </div>
    <input id="mult-range" type="range" min="0.1" max="3" step="0.1" value="1" aria-label="倍率">
    <div class="mult-ticks"><span>0.1</span><span>0.5</span><span>1.0</span><span>1.5</span><span>2.0</span><span>2.5</span><span>3.0</span></div>
  </div>
  <div class="input-row">
    <textarea id="food-input" class="line-input" rows="1" placeholder="サトウ 270k p4 c61" autocomplete="off" enterkeyhint="send"></textarea>
    <button id="mult-btn" aria-label="倍率を設定">×1.0</button>
    <button id="send-btn" class="send-btn" aria-label="追加">↑</button>
  </div>
  <div class="recent-row" id="recent-row"></div>
  <div class="hint" id="hint">いつもの書き方でそのまま送信 — 集計は自動</div>
</footer>
<footer id="rocket-footer" hidden>
  <div class="input-row">
    <textarea id="act-input" class="line-input" rows="1" placeholder="書類作成 1000 1045" autocomplete="off" enterkeyhint="send"></textarea>
    <button id="act-send" class="send-btn" aria-label="追加">↑</button>
  </div>
  <div class="hint" id="act-hint">活動名と開始・終了時刻を並べて送信 — 分数は自動</div>
</footer>
<nav class="tabbar" id="tabbar">
  <button class="tab" data-view="pfc">PFC</button>
  <button class="tab" data-view="rocket">Rocket</button>
  <button class="tab" data-view="gym">GYM</button>
</nav>
</div>

<dialog id="kpi-dialog">
  <h2>KPI設定</h2>
  <p>1日の目標値。ヘッダーの残り表示に使われます。</p>
  <div class="kpi-grid">
    <div class="kpi-field"><label for="kpi-k">カロリー (kcal)</label><input id="kpi-k" type="number" inputmode="numeric"></div>
    <div class="kpi-field"><label for="kpi-p">タンパク質 (g)</label><input id="kpi-p" type="number" inputmode="numeric"></div>
    <div class="kpi-field"><label for="kpi-f">脂質 (g)</label><input id="kpi-f" type="number" inputmode="numeric"></div>
    <div class="kpi-field"><label for="kpi-c">炭水化物 (g)</label><input id="kpi-c" type="number" inputmode="numeric"></div>
  </div>
  <div class="backup-sec">
    <div class="backup-title">Rocket</div>
    <div class="kpi-field" style="margin-bottom:10px"><label for="kpi-r">1日の活動目標 (分)</label><input id="kpi-r" type="number" inputmode="numeric"></div>
    <div class="kpi-field"><label for="crit-0">転職の条件</label>
      <input id="crit-0" type="text" style="margin-bottom:6px">
      <input id="crit-1" type="text" style="margin-bottom:6px">
      <input id="crit-2" type="text">
    </div>
  </div>
  <div class="backup-sec">
    <div class="backup-title">データ</div>
    <div class="backup-row">
      <button class="btn-backup" id="backup-export">書き出し</button>
      <button class="btn-backup" id="backup-import">読み込み</button>
    </div>
    <input type="file" id="backup-file" accept=".json,application/json" style="display:none">
    <div class="backup-note" id="backup-note">記録とKPIをJSONファイルとして保存/復元できます。</div>
  </div>
  <div class="backup-sec">
    <div class="backup-title">アプリ</div>
    <div class="backup-row">
      <button class="btn-backup" id="refresh-app">最新版に更新する</button>
    </div>
    <div class="backup-note" id="refresh-note">改修が反映されないときに押してください。記録は消えません。</div>
  </div>
  <div class="dialog-actions">
    <button class="btn-cancel" id="kpi-cancel">キャンセル</button>
    <button class="btn-save" id="kpi-save">保存</button>
  </div>
</dialog>

<script>
const STORE_KEY = 'pfc-log-v1';

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalizeStore(JSON.parse(raw));
  } catch (e) {}
  return normalizeStore({});
}

// 後から増えた項目を、既存の保存データにも欠けたまま使わせない
function normalizeStore(s) {
  if (!s || typeof s !== 'object') s = {};
  if (!s.kpi || typeof s.kpi !== 'object') s.kpi = { k: 2100, p: 175, f: 55, c: 225 };
  if (!Array.isArray(s.entries)) s.entries = [];
  if (!Array.isArray(s.acts)) s.acts = [];
  if (typeof s.actGoal !== 'number' || !(s.actGoal > 0)) s.actGoal = 120;
  if (!Array.isArray(s.criteria) || s.criteria.length !== 3) {
    s.criteria = ['年収900万', '周囲の5人', '配置リスク無し'];
  }
  if (!Array.isArray(s.milestones) || !s.milestones.length) {
    s.milestones = [
      { on: '2026-10-15', when: '10月中旬', what: '内定' },
      { on: '2026-10-31', when: '10末', what: '退職申し出' },
      { on: '2026-11-30', when: '11末', what: '退社' },
      { on: '2026-12-01', when: '12/1', what: '入社' }
    ];
  }
  return s;
}

// 日付ごとの索引と最近の食品を持っておき、描画の手間が記録の総数に左右されないようにする。
let byDate = new Map();
let recentCache = null;
let actsByDate = new Map();

function indexEntries() {
  byDate = new Map();
  for (const e of store.entries) {
    const list = byDate.get(e.date);
    if (list) list.push(e);
    else byDate.set(e.date, [e]);
  }
  recentCache = null;
}

function indexActs() {
  actsByDate = new Map();
  for (const a of store.acts) {
    const list = actsByDate.get(a.date);
    if (list) list.push(a);
    else actsByDate.set(a.date, [a]);
  }
}

function actsFor(dateStr) {
  return actsByDate.get(dateStr) || [];
}

let store = loadStore();

function todayStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
let viewDate = todayStr();

const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
function formatDateLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const label = `${m}月${d}日 (${WEEKDAYS[dt.getDay()]})`;
  return dateStr === todayStr() ? label + ' 今日' : label;
}
function shiftDate(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d + days);
  return todayStr(dt);
}

function parseEntry(text) {
  const tokens = text.trim().split(/\s+/);
  if (!tokens.length) return null;
  const entry = { name: '', k: null, p: 0, f: 0, c: 0 };
  const nameParts = [];
  for (const t of tokens) {
    let m;
    if ((m = t.match(/^(\d+(?:\.\d+)?)k(?:cal)?$/i))) entry.k = parseFloat(m[1]);
    else if ((m = t.match(/^[pP](\d+(?:\.\d+)?)$/))) entry.p = parseFloat(m[1]);
    else if ((m = t.match(/^[fF](\d+(?:\.\d+)?)$/))) entry.f = parseFloat(m[1]);
    else if ((m = t.match(/^[cC](\d+(?:\.\d+)?)$/))) entry.c = parseFloat(m[1]);
    else nameParts.push(t);
  }
  entry.name = nameParts.join(' ');
  if (!entry.name) return null;
  if (entry.k === null) {
    if (entry.p === 0 && entry.f === 0 && entry.c === 0) return null;
    entry.k = Math.round(entry.p * 4 + entry.f * 9 + entry.c * 4);
    entry.estimated = true;
  }
  return entry;
}

function entriesFor(dateStr) {
  return byDate.get(dateStr) || [];
}

// 「1045」「9:30」のどちらの書き方も0時からの分数に直す
function toMinutes(token) {
  let m;
  if ((m = token.match(/^(\d{1,2}):(\d{2})$/))) {
    const h = +m[1], mi = +m[2];
    return h < 24 && mi < 60 ? h * 60 + mi : null;
  }
  if ((m = token.match(/^(\d{3,4})$/))) {
    const h = +m[1].slice(0, -2), mi = +m[1].slice(-2);
    return h < 24 && mi < 60 ? h * 60 + mi : null;
  }
  return null;
}

function fmtClock(v) {
  return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
}

function parseActivity(text) {
  const tokens = text.trim().split(/\s+/).filter(Boolean);
  const times = [], nameParts = [];
  for (const t of tokens) {
    const v = toMinutes(t);
    if (v !== null && times.length < 2) times.push(v);
    else nameParts.push(t);
  }
  if (times.length !== 2 || !nameParts.length) return null;
  const [start, end] = times;
  let minutes = end - start;
  if (minutes < 0) minutes += 1440; // 日付をまたいだ場合
  return { name: nameParts.join(' '), start, end, minutes };
}

function minutesOn(dateStr) {
  return actsFor(dateStr).reduce((sum, a) => sum + a.minutes, 0);
}

// 今日が未達のうちは、昨日までの連続を数える(日中に途切れた表示にしない)
function streakDays() {
  const goal = store.actGoal;
  let d = todayStr();
  if (minutesOn(d) < goal) d = shiftDate(d, -1);
  let n = 0;
  while (minutesOn(d) >= goal) {
    n++;
    d = shiftDate(d, -1);
  }
  return n;
}

function renderRocket() {
  const goal = store.actGoal;
  const list = actsFor(viewDate).slice().sort((a, b) => a.start - b.start);
  const total = list.reduce((sum, a) => sum + a.minutes, 0);

  document.getElementById('r-date-label').textContent = formatDateLabel(viewDate);
  document.getElementById('r-goal-open').textContent = `目標  ${goal}分`;
  document.getElementById('r-total').textContent = total;
  document.getElementById('r-goal-label').textContent = `/ ${goal} 分`;

  const leftEl = document.getElementById('r-left');
  if (total >= goal) {
    leftEl.textContent = '達成';
    leftEl.style.color = 'var(--ok)';
  } else {
    leftEl.textContent = `あと ${goal - total}分`;
    leftEl.style.color = 'var(--text-2)';
  }

  const bar = document.getElementById('r-bar');
  bar.style.width = Math.min(100, goal > 0 ? (total / goal) * 100 : 0) + '%';
  bar.style.background = total >= goal ? 'var(--ok)' : 'var(--tab-rocket)';

  document.getElementById('criteria').innerHTML =
    store.criteria.map(c => `<div class="criterion">${escapeHtml(c)}</div>`).join('');

  const streak = streakDays();
  document.getElementById('r-streak').textContent = streak >= 2 ? `${streak}日連続` : '';

  renderTimeline();

  const log = document.getElementById('r-log');
  if (!list.length) {
    log.innerHTML = `<div class="empty"><b>この日はまだ0分</b><br>15分でも積めば、あとが軽くなる<br><span class="empty-hint">「書類作成 1000 1045」のように入力</span></div>`;
    return;
  }
  log.innerHTML = list.map(a => `
    <div class="entry">
      <div class="body">
        <span class="name">${escapeHtml(a.name)}</span>
        <span class="pfc mono">${fmtClock(a.start)}-${fmtClock(a.end)}   ${a.minutes}分</span>
      </div>
      <button class="del" data-id="${a.id}" aria-label="削除">×</button>
    </div>`).join('');
}

function daysUntil(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [ty, tm, td] = todayStr().split('-').map(Number);
  return Math.round((new Date(y, m - 1, d) - new Date(ty, tm - 1, td)) / 86400000);
}

function renderTimeline() {
  const today = todayStr();
  const nextIndex = store.milestones.findIndex(ms => ms.on >= today);

  document.getElementById('timeline').innerHTML = store.milestones.map((ms, i) => {
    const state = ms.on < today ? 'done' : (i === nextIndex ? 'next' : '');
    return `
      <div class="tl-step ${state}">
        <div class="tl-dot"></div>
        <div class="tl-when">${escapeHtml(ms.when)}</div>
        <div class="tl-what">${escapeHtml(ms.what)}</div>
      </div>`;
  }).join('');

  const countdown = document.getElementById('tl-countdown');
  if (nextIndex === -1) {
    countdown.textContent = '';
    return;
  }
  const next = store.milestones[nextIndex];
  const days = daysUntil(next.on);
  countdown.textContent = days === 0 ? `${next.what}は今日` : `${next.what}まで あと${days}日`;
}

function macroHtml(label, now, goal, barColor, noteColor) {
  const pct = Math.min(100, goal > 0 ? (now / goal) * 100 : 0);
  const over = now > goal;
  // タンパク質は超過しても困らないので警告色にしない
  const warn = over && label !== 'P';
  const left = goal - now;
  let note, noteClass;
  if (over) { note = warn ? `${fmt(now - goal)}g超過` : ''; noteClass = warn ? 'over' : 'ok'; }
  else { note = `あと${fmt(left)}g`; noteClass = ''; }
  return `
    <div class="macro-head">
      <span class="label">${label}</span>
      <span class="val">${fmt(now)}<span class="goal">/${goal}</span></span>
    </div>
    <div class="bar"><div style="width:${pct}%; background:${warn ? 'var(--over)' : barColor}"></div></div>
    <div class="macro-note ${noteClass}" style="color:${warn ? 'var(--over)' : noteColor}">${note}</div>`;
}

function fmt(n) { return Math.round(n * 10) / 10; }

function render() {
  const kpi = store.kpi;
  const entries = entriesFor(viewDate);
  const total = entries.reduce((a, e) => ({ k: a.k + e.k, p: a.p + e.p, f: a.f + e.f, c: a.c + e.c }), { k: 0, p: 0, f: 0, c: 0 });

  document.getElementById('date-label').textContent = formatDateLabel(viewDate);
  document.getElementById('kpi-open').textContent = `KPI  ${kpi.k}k   p${kpi.p}   f${kpi.f}   c${kpi.c}`;
  document.getElementById('kcal-now').textContent = fmt(total.k);
  document.getElementById('kcal-goal').textContent = `/ ${kpi.k} kcal`;

  const kLeft = kpi.k - total.k;
  const kcalLeftEl = document.getElementById('kcal-left');
  if (kLeft >= 0) { kcalLeftEl.textContent = `残り ${fmt(kLeft)}`; kcalLeftEl.style.color = 'var(--ok)'; }
  else { kcalLeftEl.textContent = `${fmt(-kLeft)} オーバー`; kcalLeftEl.style.color = 'var(--over)'; }

  const kcalBar = document.getElementById('kcal-bar');
  kcalBar.style.width = Math.min(100, kpi.k > 0 ? (total.k / kpi.k) * 100 : 0) + '%';
  kcalBar.style.background = total.k > kpi.k ? 'var(--over)' : 'var(--tab-pfc)';

  document.getElementById('macro-p').innerHTML = macroHtml('P', total.p, kpi.p, 'var(--bar-p)', 'var(--note-p)');
  document.getElementById('macro-f').innerHTML = macroHtml('F', total.f, kpi.f, 'var(--bar-f)', 'var(--note-f)');
  document.getElementById('macro-c').innerHTML = macroHtml('C', total.c, kpi.c, 'var(--bar-c)', 'var(--note-c)');

  renderRecents();
  const log = document.getElementById('log');
  if (!entries.length) {
    log.innerHTML = `<div class="empty">まだ記録がありません<br>下の欄に「サラダチキン 110k p24 f1 c0」のように入力</div>`;
    return;
  }
  log.innerHTML = entries.map(e => `
    <div class="entry">
      <span class="time">${e.time}</span>
      <div class="body">
        <span class="name">${escapeHtml(e.name)}${e.mult && e.mult !== 1 ? `<span class="mult-badge">×${e.mult}</span>` : ''}</span>
        <span class="pfc mono">${fmt(e.k)}k${e.estimated ? '*' : ''}   p${fmt(e.p)}   f${fmt(e.f)}   c${fmt(e.c)}</span>
      </div>
      <button class="del" data-id="${e.id}" aria-label="削除">×</button>
    </div>`).join('');
}

function recentFoods() {
  if (recentCache) return recentCache;
  const seen = new Set();
  const out = [];
  for (let i = store.entries.length - 1; i >= 0 && out.length < 30; i--) {
    const e = store.entries[i];
    if (seen.has(e.name)) continue;
    seen.add(e.name);
    let { k, p, f, c } = e;
    if (e.mult && e.mult !== 1) {
      k = Math.round(k / e.mult);
      p = Math.round(p / e.mult);
      f = Math.round(f / e.mult);
      c = Math.round(c / e.mult);
    }
    out.push({ name: e.name, k, p, f, c });
  }
  recentCache = out;
  return out;
}

function renderRecents() {
  const row = document.getElementById('recent-row');
  const foods = recentFoods();
  row.style.display = foods.length ? 'flex' : 'none';
  row.innerHTML = foods.map((r, i) => `<button class="recent-chip" data-i="${i}">${escapeHtml(r.name)}</button>`).join('');
  row._foods = foods;
}

  document.getElementById('food-input').value = `${r.name} ${r.k}k p${r.p} f${r.f} c${r.c}`;
  updateMultUI();
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

const multBtn = document.getElementById('mult-btn');

const multVal = document.getElementById('mult-val');
const multPreview = document.getElementById('mult-preview');
let mult = 1;

function multLabel() { return '×' + mult.toFixed(1); }

function updateMultUI() {
  multBtn.textContent = multLabel();
  multBtn.classList.toggle('active', mult !== 1);
  multVal.textContent = multLabel();
  const parsed = parseEntry(input.value);
  if (parsed && mult !== 1) {
    multPreview.textContent = `→ ${Math.round(parsed.k * mult)}k p${Math.round(parsed.p * mult)} f${Math.round(parsed.f * mult)} c${Math.round(parsed.c * mult)}`;
  } else {
    multPreview.textContent = '';
  }
}

multBtn.addEventListener('click', () => {
  multPanel.classList.toggle('open');
  updateMultUI();
});
multRange.addEventListener('input', () => {
  mult = Math.round(parseFloat(multRange.value) * 10) / 10;
  updateMultUI();
});
input.addEventListener('input', updateMultUI);

function resetMult() {
  mult = 1;
  multRange.value = 1;
  multPanel.classList.remove('open');
  updateMultUI();
}

function showHint(msg, isError) {
  hint.textContent = msg;
  hint.classList.toggle('error', !!isError);
}

function submit() {
  const text = input.value;
  if (!text.trim()) return;
  const parsed = parseEntry(text);
  if (!parsed) {
    showHint('読み取れませんでした。「名前 270k p4 f2 c61」の形式で入力', true);
    return;
  }
  const appliedMult = mult;
  if (appliedMult !== 1) {
    parsed.k = Math.round(parsed.k * appliedMult);
    parsed.p = Math.round(parsed.p * appliedMult);
    parsed.f = Math.round(parsed.f * appliedMult);
    parsed.c = Math.round(parsed.c * appliedMult);
    parsed.mult = appliedMult;
  }
  const now = new Date();
  const entry = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    date: viewDate,
    time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
    ...parsed
  };
  store.entries.push(entry);
  const bucket = byDate.get(entry.date);
  if (bucket) bucket.push(entry);
  else byDate.set(entry.date, [entry]);
  recentCache = null;
  saveStore();
  input.value = '';
  resetMult();
  if (appliedMult !== 1) showHint(`×${appliedMult} を適用して追加しました`, false);
  else showHint(parsed.estimated ? 'kcal未入力のためPFCから概算しました (*)' : 'いつもの書き方でそのまま送信 — 集計は自動', false);
  render();
  window.scrollTo(0, document.body.scrollHeight);
}

const backupExport = document.getElementById('backup-export');

function noteBackup(msg, isError) {

  backupNote.classList.toggle('error', !!isError);
}
function resetBackupUI() {

  backupImport.textContent = '読み込み';

function fallbackDownload(filename, data) {
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  noteBackup('バックアップを保存しました。', false);
}

backupExport.addEventListener('click', () => {
  const data = JSON.stringify(store, null, 2);
  const filename = `pfc-log-backup-${todayStr()}.json`;
  if (window.claude && window.claude.downloads) {
    window.claude.downloads.save({ filename, data }).then(() => {
      noteBackup('バックアップを保存しました。', false);
    }).catch(err => {
      const code = err && err.code;
      if (code === 'declined') noteBackup('保存をキャンセルしました。', false);
      else if (code === 'rate_limited') noteBackup('少し待ってからもう一度試してください。', true);
      else fallbackDownload(filename, data);
    });
  } else {
    fallbackDownload(filename, data);
  }
});

backupImport.addEventListener('click', () => {
  if (pendingRestore) {
    store = pendingRestore;
    indexEntries();
    indexActs();
    saveStore();
    resetBackupUI();

    renderRocket();
    render();
    return;

});

backupFile.addEventListener('change', () => {
  const file = backupFile.files[0];
  backupFile.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj || typeof obj.kpi !== 'object' || !Array.isArray(obj.entries)) throw new Error('bad shape');
      pendingRestore = normalizeStore(obj);
      backupImport.textContent = `上書き実行 (${obj.entries.length}件)`;
      noteBackup('もう一度「上書き実行」を押すと、現在のデータをこのバックアップで置き換えます。', false);
    } catch (e) {
      noteBackup('ファイルを読み取れませんでした。書き出したJSONを選んでください。', true);
    }
  };
  reader.readAsText(file);
});

});

// アプリ本体を端末にキャッシュして、起動時に通信の完了を待たないようにする。
if ('serviceWorker' in navigator) {
  // まだ操作していない画面なら黙って新版に入れ替える。触ったあとは勝手に消さず確認を出す。
  let touched = false;
  ['pointerdown', 'keydown'].forEach(type =>
    window.addEventListener(type, () => { touched = true; }, { capture: true, once: true }));

  // 更新の知らせは読み込み直後に届きうるので、待たずに受け口を開けておく
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'update-ready') return;
    if (!touched && !sessionStorage.getItem('pfc-reloaded')) {
      sessionStorage.setItem('pfc-reloaded', '1');
      location.reload();
      return;
    }
    document.getElementById('update-bar').hidden = false;
  });
  document.getElementById('update-btn').addEventListener('click', () => location.reload());

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });

  // アプリを再び開いたときにも更新を確認する(起動しっぱなしで数日使う場合の取りこぼし対策)
  let lastCheck = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - lastCheck < 5 * 60 * 1000) return;
    lastCheck = Date.now();
    navigator.serviceWorker.getRegistration().then(reg => reg && reg.update()).catch(() => {});
  });
}
</script>
</body>
</html>
